# Detekt configuration — builds upon the default config.
# Only overrides are listed here; everything else uses defaults.
# See https://detekt.dev/docs/rules/overview for all rules.

complexity:
  LongMethod:
    active: false
  LongParameterList:
    active: false
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    active: false
  NestedBlockDepth:
    active: false
  ComplexCondition:
    threshold: 5

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
  MatchingDeclarationName:
    active: false

performance:
  SpreadOperator:
    active: false

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 200
    excludeCommentStatements: true
  ReturnCount:
    max: 8
  ForbiddenComment:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    maxDestructuringEntries: 4
  LoopWithTooManyJumpStatements:
    maxJumpCount: 3

exceptions:
  TooGenericExceptionCaught:
    active: false

Compose:
  ModifierMissing:
    active: false
  LambdaParameterInRestartableEffect:
    active: false
  CompositionLocalAllowlist:
    allowedCompositionLocals:
      - LocalEmoteAnimationCoordinator
      - LocalAdaptiveColors
      - LocalContentAlpha
